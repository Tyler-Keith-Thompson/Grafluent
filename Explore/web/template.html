<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<meta name="description" content="@DESCRIPTION@">
<script>
  // The theme the reader picked last time, before anything is drawn.
  try { const t = localStorage.getItem("explore-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  // A new page opens at its top, even where the host keeps the previous page's scroll position.
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231d4f9c%22/%3E%3Cpath d=%22M9 22L16 9l7 13z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%229%22 cy=%2222%22 r=%223.5%22 fill=%22white%22/%3E%3Ccircle cx=%2216%22 cy=%229%22 r=%223.5%22 fill=%22white%22/%3E%3Ccircle cx=%2223%22 cy=%2222%22 r=%223.5%22 fill=%22white%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="explore.css">
<!-- wasm -->
<link rel="modulepreload" href="index.js">
<link rel="preload" href="Explore.wasm" as="fetch" type="application/wasm" crossorigin>
<!-- end wasm -->
</head>
<body data-page="@PAGE@">
<div class="wrap">
  <nav class="topbar" aria-label="Site">
    <a class="home" href="./">Explore <b>Grafluent</b></a>
    <span class="spacer"></span>
@MENU@
    <a href="../documentation/">Docs</a>
    <button type="button" class="theme" id="theme" aria-label="Switch between light and dark">◐<span class="tlabel"> Theme</span></button>
  </nav>
@BODY@
@PAGER@
</div>
<script>
  if (!location.hash) window.scrollTo(0, 0);
  // Until the reader scrolls, keep the page at its top while the interactive parts grow in.
  if (!location.hash) {
    let pinned = true;
    const release = () => { pinned = false; };
    for (const kind of ["wheel", "touchstart", "keydown", "mousedown"]) addEventListener(kind, release, { once: true, passive: true });
    const pin = new ResizeObserver(() => { if (pinned) window.scrollTo(0, 0); });
    pin.observe(document.body);
    setTimeout(() => { pinned = false; pin.disconnect(); }, 3000);
  }
  document.getElementById("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("explore-theme", root.dataset.theme); } catch {}
  });
</script>
<!-- wasm -->
<script type="module">
  // Grafluent and the interface run as WebAssembly; this loads them.
  import { init } from "./index.js";
  // The interactive parts mount after the page has laid out, and their height pushes the
  // reader down, so return to the top once they are drawn (unless the link named a section).
  const toTop = () => { if (!location.hash) window.scrollTo(0, 0); };
  init().then(() => requestAnimationFrame(() => requestAnimationFrame(toTop))).catch((error) => {
    console.error("The explorer failed to start:", error);
    const app = document.getElementById("app");
    if (app) app.textContent = "The interactive part of this page could not start in this browser.";
  });
</script>
<!-- end wasm -->
</body>
</html>
