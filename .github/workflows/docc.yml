name: DocC

# Builds one combined DocC site for every library module and publishes it to GitHub Pages
# (the gh-pages branch) at https://tyler-keith-thompson.github.io/Grafluent/documentation/.
# Linux, not macOS: the library imports no Foundation or Darwin, and Linux minutes cost a tenth.
#
# The site is Bazel's //:docs (see tools/docc.bzl), built against the BuildBuddy remote cache, so
# a push rebuilds only the modules it changed and the modules that depend on them.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes a build still running, so minutes are not spent on stale docs.
concurrency:
  group: docc
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    # rules_swift's Linux toolchain is whatever swiftc is on the PATH; docc comes from beside it.
    container: swift:6.2
    env:
      # The image has clang (from the Swift toolchain) but no gcc, which is where rules_cc looks
      # first. swift-numerics has C shims.
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazel
        run: |
          # The image has neither curl nor python3; the umbrella's extension index needs python3.
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl python3
          # Bazelisk runs the Bazel in .bazelversion.
          curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
      - name: Configure the remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # user.bazelrc is gitignored; .bazelrc imports it if present. Without the key the build
          # still works, only uncached.
          # The runner is thrown away, so .bazelrc's local disk cache would only cost copying.
          echo "build --disk_cache=" > user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "build --remote_cache_compression"
            } >> user.bazelrc
          fi
      - name: Generate the combined documentation
        run: |
          bazel build //:docs
          cp -RL bazel-bin/docs ./docs
          chmod -R u+w ./docs
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
