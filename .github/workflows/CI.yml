name: CI

# The test suite, on every branch but main. PR_CI and Release call it too.
on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_dispatch:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

jobs:
  bazel:
    name: Bazel tests
    runs-on: ubuntu-26.04
    # rules_swift's Linux toolchain is whatever swiftc is on the PATH.
    container: swift:6.3
    env:
      # The image has clang but no gcc, which is where rules_cc looks first.
      CC: clang
    steps:
      - uses: actions/checkout@v7
      - name: Install Bazel
        run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates curl python3
          # Bazelisk runs the Bazel in .bazelversion.
          curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
      - name: Configure the remote cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # .bazelrc imports user.bazelrc when present. Without the key the build is uncached.
          echo "build --disk_cache=" > user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            {
              echo "build --bes_results_url=https://app.buildbuddy.io/invocation/"
              echo "build --bes_backend=grpcs://remote.buildbuddy.io"
              echo "build --remote_cache=grpcs://remote.buildbuddy.io"
              echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
              echo "build --remote_cache_compression"
            } >> user.bazelrc
          fi
      - name: Test (debug)
        run: bazel test //...
      - name: Test (release)
        run: bazel test --config=release //...

  swiftpm:
    name: SwiftPM build
    runs-on: ubuntu-26.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
